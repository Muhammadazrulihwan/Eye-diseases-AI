services:
  eye-disease:
    build: .
    container_name: eye-disease
    restart: unless-stopped

    ports:
      - "127.0.0.1:8003:8003"

    environment:
      - PORT=8003

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s